apiVersion: v1
kind: Namespace
metadata:
  name: spike
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-server
  namespace: spike
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluidbox-server
  template:
    metadata:
      labels:
        app: fluidbox-server
    spec:
      containers:
        - name: netexec
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8788"]
          ports:
            - containerPort: 8788
---
apiVersion: v1
kind: Service
metadata:
  name: fake-server
  namespace: spike
spec:
  selector:
    app: fluidbox-server
  ports:
    - port: 8788
      targetPort: 8788
---
apiVersion: v1
kind: Pod
metadata:
  name: sandbox
  namespace: spike
  labels:
    app: fluidbox-sandbox
    fluidbox.dev/session-id: s1
    fluidbox.dev/tenant-id: t1
    fluidbox.dev/run-id: r1
spec:
  nodeName: fluidbox-netgrant-spike-control-plane
  tolerations:
    - operator: Exists
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "infinity"]
