apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: r2c-exact-podip-deny
  namespace: spike
spec:
  endpointSelector:
    matchLabels:
      app: fluidbox-sandbox
  egressDeny:
    # The EXACT /32 of the fluidbox-server pod. If a CIDR selector could match
    # an in-cluster identity, this must beat the identity allow below.
    - toCIDR:
        - 10.244.1.17/32
  egress:
    - toEndpoints:
        - matchLabels:
            app: fluidbox-server
      toPorts:
        - ports: [{port: "8788", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
    - toEntities: [world]
