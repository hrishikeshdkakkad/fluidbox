# The READ-MOSTLY tier. Writes need a human, autonomy is forbidden, the network
# is offline, and the fallback is DENY rather than approve.
#
# KNOWN CONSEQUENCE, by design: `defaults.tool_action: deny` refuses any tool not
# listed below — including tools a future CLI upgrade introduces. That is the
# intended failure direction, but it is a standing maintenance obligation: when
# the pinned CLI gains a tool, decide about it here rather than discovering the
# denial in a run.
name: governed
defaults:
  tool_action: deny
egress:
  mode: proxy-only
network:
  max_mode: offline
budgets:
  max_wall_clock_secs: 900
  max_tokens: 300000
  max_cost_usd: 1.0
  max_tool_calls: 40
approvals:
  default_ttl_secs: 300
  scope: once
  timeout_action: deny
autonomy:
  permitted: false
  on_approval_rule: deny
tools:
  # Reading and the agent's own bookkeeping. Deliberately SHORTER than the
  # standard tier's list: no ToolSearch (it is the handle to deferred MCP
  # tools), no Task* bookkeeping.
  - match:
      [
        "Read",
        "Glob",
        "Grep",
        "LS",
        "TodoWrite",
        "NotebookRead",
        "EnterPlanMode",
        "ExitPlanMode",
        "AskUserQuestion",
      ]
    action: allow

  # The defining difference of this tier: a write is a decision a human makes.
  #
  # The `deny` globs below ARE hard constraints. The `allow` list is not: the
  # engine routes any path outside it to RequireApproval independently of this
  # rule's `action` (see policy.rs, "hardcoded Approve … INDEPENDENT of
  # rule.action"), and this rule already asks for approval, so the allow list
  # changes no verdict here. It is kept because it is the shape the Governance
  # matrix displays and because a future action change would give it teeth.
  - match: ["Edit", "Write", "MultiEdit", "NotebookEdit"]
    action: approve
    risk: writes require a human under the governed tier
    paths:
      allow: ["/workspace/**"]
      deny: ["**/.env", "**/.env.*", "**/.git/config", "**/.git/hooks/**"]

  # Shell: a read-only toolbox, and `on_no_match: deny` rather than approve —
  # under this tier an unrecognised command is refused, not escalated.
  #
  # THE DENY LIST IS LOAD-BEARING, NOT BELT-AND-BRACES. A prefix match returns
  # this rule's `allow` for the WHOLE command, so `find` and `pwd` in the list
  # above would otherwise auto-approve `find /workspace -delete` and
  # `pwd && rm -rf /workspace` — making this tier's central claim ("writes need
  # a human") false. deny_regex is consulted BEFORE prefixes, so it is the only
  # thing that can refuse a destructive tail on a benign head.
  #
  # Hence the metacharacter denies: chaining, pipes, redirection, and command
  # substitution each turn a read-only head into an arbitrary command. That is
  # stricter than `standard` on purpose — `standard` inherits `default`'s
  # documented position that the sandbox, not the classifier, is the real
  # boundary. `governed` makes a stronger promise and has to keep it.
  - match: ["Bash", "BashOutput", "KillShell"]
    action: allow
    shell:
      allow_prefixes:
        - "ls"
        - "cat"
        - "head"
        - "tail"
        - "wc"
        - "grep"
        - "rg"
        - "find"
        - "pwd"
        - "git status"
        - "git diff"
        - "git log"
      deny_regex:
        # Anything that composes a second command onto an allowed first one.
        - "[;&|]"
        - "[<>]"
        - "\\$\\("
        - "`"
        # find/xargs flags that execute or delete without a second command.
        - "-delete"
        - "-exec"
        - "-execdir"
        - "-fprint"
        - "-fls"
        # Destructive or permission-changing verbs, wherever they appear.
        - "\\brm\\b"
        - "\\bdd\\b"
        - "\\bmv\\b"
        - "\\btee\\b"
        - "\\btruncate\\b"
        - "\\bchmod\\b"
        - "\\bchown\\b"
        # Exfiltration, as on every other tier.
        - "\\bcurl\\b"
        - "\\bwget\\b"
        - "\\bnc\\b"
        - "\\bssh\\b"
        - "\\bscp\\b"
        - "\\bsudo\\b"
        - "/etc/passwd"
      on_no_match: deny

  # Listed explicitly rather than left to defaults.tool_action: an MCP call is
  # worth a human decision and a `risk` string on the approval card, not a
  # silent refusal an operator has to go read a policy to explain.
  - match: ["mcp__*"]
    action: approve
    risk: unreviewed MCP tool
