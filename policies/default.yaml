# fluidbox seed policy. First-match-wins over `tools`; anything unmatched
# falls back to defaults.tool_action (fail-safe: ask a human).
#
# The shell classifier and budgets below are the PLAN.md §10 #1/#3 decisions,
# resolved 2026-07-10 from live-run ledger data and pinned by the
# `seed_policy_semantics` test in fluidbox-core (change both together).
# This file is the BOOT SEED for a fresh database only — `seed_policy_if_absent`
# never re-applies it over an existing policy. Edit a running deployment through
# the Governance page (each publish appends an immutable version), or import YAML
# with `POST /v1/policies` (also appends; byte-equal content is a no-op). Either
# way, in-flight runs keep the snapshot their RunSpec froze.
name: default
defaults:
  tool_action: approve
egress:
  mode: proxy-only
# Budgets are a CEILING for every run of an agent on this policy: revision
# defaults and per-run requests may tighten them, never widen past them.
# Data (2026-07-10, live demo runs on haiku + opus): a real fix-a-failing-test
# run costs $0.05–$0.37, uses 34k–231k tokens (incl. cache) and ≤4 tool
# calls. Caps sit 4–25× above observed so a runaway loop stops early while
# legitimate bigger tasks fit; widen per-agent deliberately when needed.
budgets:
  max_wall_clock_secs: 1800
  max_tokens: 1000000
  max_cost_usd: 2.5
  max_tool_calls: 100
approvals:
  default_ttl_secs: 600
  scope: once
  timeout_action: deny
autonomy:
  permitted: true
  on_approval_rule: deny
tools:
  # Reading, searching, and the agent's own bookkeeping are safe anywhere in
  # the sandbox: none of these execute anything or leave the run.
  #
  # Everything after ToolSearch on this list is here because the gate can now
  # SEE it. Until the PreToolUse hook landed, the Claude Code CLI auto-approved
  # these whole classes and the calls never reached /permission at all; with the
  # gate mandatory they do, and an unmatched tool falls to defaults.tool_action
  # (approve), which would pause every supervised run on the agent's own
  # plan-mode toggles and task bookkeeping — and DENY them in autonomous runs
  # via autonomy.on_approval_rule. Registering an opinion per tool is what makes
  # the mandatory gate usable without widening it.
  #
  # `Task` is deliberately NOT on this list any more — see the deny rule below.
  - match:
      [
        "Read",
        "Glob",
        "Grep",
        "LS",
        "TodoWrite",
        "NotebookRead",
        "ToolSearch",
        "EnterPlanMode",
        "ExitPlanMode",
        "AskUserQuestion",
        "ReportFindings",
        "TaskGet",
        "TaskList",
        "TaskOutput",
        "CronList",
      ]
    action: allow

  # Sub-execution: DENIED. This is the one disposition in this file that is a
  # security decision rather than ergonomics, so it is stated at length.
  #
  # These tools do not act themselves — they start an agent, workflow, skill, or
  # background task that then calls tools of its own. Those nested calls may
  # never surface as top-level tool_use/tool_result blocks, which means they
  # would be neither routed to this gate by the runner's PreToolUse hook nor
  # caught by the GateWitness tripwire — which documents itself as "a knowingly
  # incomplete detector" precisely here. Nested-call gating is UNPROVEN
  # (docs/reviews/claude-tool-gate-validation.md §6 calls it "the most important
  # open question left").
  #
  # `approve` would therefore be worse than it looks: one human click would
  # authorise an unbounded, unobserved tool tree. Until nested calls are
  # measured reaching /permission, the seed fails closed. An operator who has
  # measured it can widen this deliberately, per agent.
  #
  # `Task` is included even though the pinned CLI advertises `Agent` instead:
  # the previous seed ALLOWED `Task`, which was inert only by accident of
  # naming. A latent allow-rule for a sub-execution tool is a bypass waiting for
  # an upstream rename.
  - match: ["Agent", "Task", "Workflow", "Skill", "TaskCreate"]
    action: deny
    risk: spawns sub-execution whose nested tool calls the gate may never see

  # Edits are free inside the workspace; anything else asks a human.
  # (These path globs are hygiene, not hard security: shell redirection via
  # an allowed prefix can still write files. The real boundary is that the
  # workspace is a disposable copy inside an isolated sandbox.)
  - match: ["Edit", "Write", "MultiEdit", "NotebookEdit"]
    action: allow
    paths:
      allow: ["/workspace/**"]
      deny: ["**/.env", "**/.env.*", "**/.git/config", "**/.git/hooks/**"]

  # Shell: a benign toolbox is pre-approved; destructive or exfiltrating
  # patterns are denied outright; everything else pauses for approval.
  # python/node/pytest are allowed because running the project's code IS the
  # job — network egress from inside them is bounded by the sandbox network
  # mode (containment layer), not by this classifier.
  - match: ["Bash", "BashOutput", "KillShell"]
    action: allow
    shell:
      allow_prefixes:
        # observed agent behavior (ledger): python3 -m unittest, git status…
        - "ls"
        - "cat"
        - "head"
        - "tail"
        - "wc"
        - "grep"
        - "rg"
        - "find"
        - "pwd"
        - "echo"
        - "which"
        - "env | grep"
        - "python"
        - "python3"
        - "pytest"
        - "pip install -r"
        - "node"
        - "npm test"
        - "npm run test"
        - "npx jest"
        - "npx vitest"
        - "cargo test"
        - "cargo build"
        - "cargo check"
        - "go test"
        - "make test"
        - "git status"
        - "git diff"
        - "git log"
        - "git add"
        - "git commit"
        - "git show"
        - "cd"
        - "mkdir"
        - "touch"
        - "mv"
        - "cp"
        - "sed"
        - "awk"
        # read-only text/file utilities (zero write surface of their own)
        - "diff"
        - "sort"
        - "uniq"
        - "cut"
        - "tr"
        - "stat"
        - "file"
        - "du"
        - "printf"
        - "basename"
        - "dirname"
        - "date"
      deny_regex:
        # rm -rf / and /*, including split flags (rm -r -f /)
        - "rm\\s+(-[a-z]+\\s+)*-[a-z]*r[a-z]*(\\s+-[a-z]+)*\\s+/\\*?(\\s|$)"
        - "\\bcurl\\b"
        - "\\bwget\\b"
        - "\\bnc\\b"
        - "\\bssh\\b"
        - "\\bscp\\b"
        # any force push: --force, --force-with-lease, -f
        - "git\\s+push\\b.*\\s(--force(-with-lease)?|-f)\\b"
        - "\\bsudo\\b"
        - "/etc/passwd"
        - "\\bchmod\\s+777\\b"
      on_no_match: approve

  # Network tools: the sandbox has no business fetching the internet.
  # DesignSync joins them because it syncs to an external service — same egress
  # shape, same answer.
  # `Monitor` is here, not in the allow list above, and the reason is worth
  # stating: it is NOT observational. The pinned CLI's own tool text says
  # "Monitor runs bash" and "The script runs in the same shell environment as
  # Bash", and it accepts a `ws:` source that opens an outbound WebSocket to an
  # arbitrary URL. So it carries BOTH the shell surface that `Bash` gets
  # classified for and the egress surface these tools are denied for, while
  # being subject to neither. It was allow-listed when the 23 previously
  # ungoverned tools were registered — every tool got a rule, but this one got
  # the wrong rule, which a pinning test cannot catch.
  - match: ["WebFetch", "WebSearch", "DesignSync", "Monitor"]
    action: deny
    risk: network egress from sandbox

  # Effects that OUTLIVE the run or leave it. A run's workspace is disposable
  # and its sandbox is torn down; a schedule, a wake-up, a notification, or a
  # message to another agent is none of those. They are allowed to exist, but a
  # human decides — which is exactly what defaults.tool_action would have done
  # anyway. Naming them explicitly buys two things the fallback does not: a
  # `risk` string on the approval card, and a visible row in the Governance
  # matrix instead of a silent "default".
  #
  # EnterWorktree/ExitWorktree are here rather than in the allow list because
  # `EnterWorktree` can move the agent to a tree the Edit rule's
  # `/workspace/**` path constraint no longer describes.
  - match:
      [
        "TaskStop",
        "TaskUpdate",
        "SendMessage",
        "CronCreate",
        "CronDelete",
        "ScheduleWakeup",
        "PushNotification",
        "EnterWorktree",
        "ExitWorktree",
      ]
    action: approve
    risk: effect outside this run's disposable workspace

  # MCP tools ask a human by default. Bundles (Phase 5) make tools
  # AVAILABLE; this rule still judges every call (attach ≠ allow) — grant
  # per-server/tool allow rules in agent policies deliberately.
  - match: ["mcp__*"]
    action: approve
    risk: unreviewed MCP tool
