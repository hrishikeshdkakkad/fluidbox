                - /url: "#3-register-an-agent"
            - generic [ref=f5e103]:
              - code [ref=f5e106]:
                - generic [ref=f5e107]: curl -sX POST "$FLUIDBOX_URL/v1/agents" \
                - generic [ref=f5e108]: "-H \"Authorization: Bearer $FLUIDBOX_ADMIN_TOKEN\" \\"
                - generic [ref=f5e109]: "-H 'content-type: application/json' \\"
                - generic [ref=f5e110]: "-d '{"
                - generic [ref=f5e111]: "\"name\": \"fixer\","
                - generic [ref=f5e112]: "\"system_prompt\": \"You fix failing tests. Change as little as possible.\","
                - generic [ref=f5e113]: "\"model\": \"claude-haiku-4-5\","
                - generic [ref=f5e114]: "\"policy\": \"default\","
                - generic [ref=f5e115]: "\"budgets\": { \"max_cost_usd\": 2.5, \"max_wall_clock_secs\": 1800 }"
                - generic [ref=f5e116]: "}'"
              - button "Copy code" [ref=f5e117] [cursor=pointer]: Copy
            - paragraph [ref=f5e118]: "Two things to note in that body:"
            - list [ref=f5e119]:
              - listitem [ref=f5e120]:
                - code [ref=f5e121]: system_prompt
                - text: is
                - strong [ref=f5e122]: who the agent is
                - text: and lives on the revision. The
                - strong [ref=f5e123]: task
                - text: is separate and comes per run.
              - listitem [ref=f5e124]:
                - code [ref=f5e125]: "policy: \"default\""
                - text: names the governance rules. The run will freeze a full snapshot of that policy, so editing it later will not change this run.
            - heading [level=3] [ref=f5e126]:
              - link "4. Start a run" [ref=f5e127] [cursor=pointer]:
