              - button "Copy code" [ref=f5e153] [cursor=pointer]: Copy
            - paragraph [ref=f5e154]:
              - text: "The stream is resumable: send"
              - code [ref=f5e155]: Last-Event-ID
              - text: with the last
              - code [ref=f5e156]: seq
              - text: you processed and delivery continues exactly where it stopped. Under the hood a database notification is only a wakeup — the
              - code [ref=f5e157]: seq
              - text: catch-up query is the delivery source of truth, which is what makes both polling and streaming exact about each other.
            - heading [level=3] [ref=f5e158]:
              - link "6. Approve something" [ref=f5e159] [cursor=pointer]:
                - /url: "#6-approve-something"
            - paragraph [ref=f5e160]:
              - text: When the agent reaches a tool call the policy will not auto-allow, the run enters
              - code [ref=f5e161]: awaiting_approval
              - text: and an
              - code [ref=f5e162]: approval.requested
              - text: event appears.
            - generic [ref=f5e163]:
              - code [ref=f5e166]:
                - generic [ref=f5e167]: ID=$(curl -s "$FLUIDBOX_URL/v1/approvals" \
                - generic [ref=f5e168]: "-H \"Authorization: Bearer $FLUIDBOX_ADMIN_TOKEN\" | jq -r '.approvals[0].id')"
                - generic [ref=f5e169]: curl -sX POST "$FLUIDBOX_URL/v1/approvals/$ID/decision" \
                - generic [ref=f5e170]: "-H \"Authorization: Bearer $FLUIDBOX_ADMIN_TOKEN\" \\"
                - generic [ref=f5e171]: "-H 'content-type: application/json' \\"
                - generic [ref=f5e172]: "-d '{\"decision\":\"approved_once\"}'"
              - button "Copy code" [ref=f5e173] [cursor=pointer]: Copy
            - paragraph [ref=f5e174]:
              - code [ref=f5e175]: approved_once
              - text: allows this single call;
              - code [ref=f5e176]: approved_session
              - text: allows that tool for the rest of the run;
              - code [ref=f5e177]: denied
              - text: returns a tool error to the model, which usually causes it to try a different approach rather than give up.
            - paragraph [ref=f5e178]:
              - text: Decisions are idempotent by
              - code [ref=f5e179]: (session_id, tool_call_id)
              - text: and settled by a compare-and-swap, so a double-submit produces exactly one decision.
