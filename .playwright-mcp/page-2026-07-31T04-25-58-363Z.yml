            - generic [ref=f5e128]:
              - code [ref=f5e131]:
                - generic [ref=f5e132]: RUN=$(curl -sX POST "$FLUIDBOX_URL/v1/sessions" \
                - generic [ref=f5e133]: "-H \"Authorization: Bearer $FLUIDBOX_ADMIN_TOKEN\" \\"
                - generic [ref=f5e134]: "-H 'content-type: application/json' \\"
                - generic [ref=f5e135]: "-d '{"
                - generic [ref=f5e136]: "\"agent\": \"fixer\","
                - generic [ref=f5e137]: "\"task\": \"Fix the failing test in crates/fluidbox-core.\","
                - generic [ref=f5e138]: "\"workspace\": { \"kind\": \"local_copy\", \"path\": \"'\"$PWD\"'\" }"
                - generic [ref=f5e139]: "}' | jq -r .session.id)"
              - button "Copy code" [ref=f5e140] [cursor=pointer]: Copy
            - paragraph [ref=f5e141]:
