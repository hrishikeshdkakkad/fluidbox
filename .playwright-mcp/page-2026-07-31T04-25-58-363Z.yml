              - listitem [ref=f5e65]: Rust and pnpm
              - listitem [ref=f5e66]:
                - text: An
                - code [ref=f5e67]: ANTHROPIC_API_KEY
                - text: ", if you want a live agent rather than a replay"
            - paragraph [ref=f5e68]:
              - text: No Rust toolchain handy? The
              - link "Docker eval stack" [ref=f5e69] [cursor=pointer]:
                - /url: /docs/docker
              - text: runs the same governed loop from published images in one command — come back here when you want to develop against it.
            - heading [level=3] [ref=f5e70]:
              - link "1. Bootstrap" [ref=f5e71] [cursor=pointer]:
                - /url: "#1-bootstrap"
            - generic [ref=f5e72]:
              - code [ref=f5e75]:
                - generic [ref=f5e76]: "just setup # idempotent: .env + secrets, web env, pnpm install, runner image"
                - generic [ref=f5e77]: "just doctor # preflight — validates every environment gotcha and prints the fix"
              - button "Copy code" [ref=f5e78] [cursor=pointer]: Copy
            - paragraph [ref=f5e79]:
              - code [ref=f5e80]: just doctor
              - text: "is worth reading rather than skimming. It catches the configuration mistakes that otherwise cost an hour, most notably:"
            - list [ref=f5e81]:
              - listitem [ref=f5e82]:
                - text: "**"
                - code [ref=f5e83]: FLUIDBOX_BIND
                - text: must be
                - code [ref=f5e84]: 0.0.0.0:8787
                - text: ", not loopback.** Sandboxes reach the control plane through"
                - code [ref=f5e85]: host.docker.internal
                - text: ", which resolves to the host's gateway address. A loopback bind is unreachable from inside a container."
              - listitem [ref=f5e86]:
                - strong [ref=f5e87]: The model key lives only in the gateway container
                - text: ", injected from"
                - code [ref=f5e88]: .env
                - text: . The control plane never holds it. Adding the key needs no server restart — just
                - code [ref=f5e89]: just gateway-up
                - text: .
            - heading [level=3] [ref=f5e90]:
              - link "2. Start the stack" [ref=f5e91] [cursor=pointer]:
                - /url: "#2-start-the-stack"
            - generic [ref=f5e92]:
              - code [ref=f5e95]:
                - generic [ref=f5e96]: "just db-up # local Postgres on 127.0.0.1:5433"
                - generic [ref=f5e97]: "just gateway-up # the pinned model gateway container"
                - generic [ref=f5e98]: "just dev # gateway + control plane + dashboard"
              - button "Copy code" [ref=f5e99] [cursor=pointer]: Copy
            - paragraph [ref=f5e100]: Migrations run automatically on boot, so a fresh database volume needs no provisioning step.
            - heading [level=3] [ref=f5e101]:
