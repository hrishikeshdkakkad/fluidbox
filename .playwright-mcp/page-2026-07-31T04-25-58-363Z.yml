              - text: copies the path.
              - strong [ref=f5e143]: The original repository is never touched
              - text: — the credentialed fetch and the copy both happen control-plane-side, and the agent only ever sees a bind-mounted copy at
              - code [ref=f5e144]: /workspace
              - text: .
