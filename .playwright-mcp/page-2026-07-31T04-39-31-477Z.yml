            - generic [ref=f12e91]:
              - paragraph [ref=f12e92]:
                - strong [ref=f12e93]: Multi-user MCP control plane.
                - text: Six phases (A–F) and migrations
                - code [ref=f12e94]: "0011"
                - text: →
                - code [ref=f12e95]: "0025"
                - text: turn fluidbox from a single-admin control plane into one that can host many organizations, many users, and many separately-owned credentials without ever letting a model pick an identity. Every hosted capability is
                - strong [ref=f12e96]: opt-in behind a flag, and the default single-admin Docker deployment is byte-for-byte the same product
                - text: —
                - code [ref=f12e97]: FLUIDBOX_REQUIRE_SSO
                - text: unset means today's behavior, unchanged.
              - paragraph [ref=f12e98]:
                - text: "The organizing idea:"
                - strong [ref=f12e99]: connector definition ≠ credential-bearing connection ≠ agent connection requirement ≠ per-run resource binding.
                - text: An agent declares
                - emphasis [ref=f12e100]: what
                - text: it requires, never
                - emphasis [ref=f12e101]: whose
                - text: credential satisfies it. Run creation resolves each requirement to an explicit, frozen authority source before any model spend. The model picks tools; it can never pick an identity.
              - paragraph [ref=f12e102]: "Highlights:"
              - list [ref=f12e103]:
                - listitem [ref=f12e104]:
                  - strong [ref=f12e105]: Per-organization, IdP-agnostic identity
                  - text: —
                  - code [ref=f12e106]: FLUIDBOX_REQUIRE_SSO=1
                  - text: confines the admin token to
                  - code [ref=f12e107]: /v1/admin/*
                  - text: "as break-glass and introduces three principals: Operator (admin token), User ("
                  - code [ref=f12e108]: __Host-fbx_web
                  - text: session cookie), and Pat (
                  - code [ref=f12e109]: fbx_pat_
                  - text: bearer). Any conformant OIDC issuer is configured
                  - strong [ref=f12e110]: per org
                  - text: (issuer + client + sealed secret + claim mappings); logins are two-phase and browser-bound; sessions are server-side with idle/absolute/re-auth windows. No IdP configured ⇒ single-admin mode.
                - listitem [ref=f12e111]:
                  - strong [ref=f12e112]: Tenant isolation with a database floor
                  - text: — every tenant-owned
                  - code [ref=f12e113]: fluidbox-db
                  - text: method now takes a
                  - code [ref=f12e114]: TenantScope
                  - text: that carries its id into a
                  - code [ref=f12e115]: tenant_id = $n
                  - text: predicate, so isolation is a
                  - emphasis [ref=f12e116]: signature requirement
                  - text: rather than a remember-to-filter convention. Migration
                  - code [ref=f12e117]: "0018"
                  - text: "adds the floor underneath: 37 tables"
                  - code [ref=f12e118]: ENABLE
                  - text: +
                  - code [ref=f12e119]: FORCE
                  - text: row-level security keyed on a transaction-local
                  - code [ref=f12e120]: fluidbox.tenant_id
                  - text: GUC, with
                  - code [ref=f12e121]: FLUIDBOX_RUNTIME_ROLE=fluidbox_runtime
                  - text: splitting the pool onto a non-owner role holding enumerated per-table grants. Cross-tenant access exists only through a short, named, grep-able set of audited bypasses.
                - listitem [ref=f12e122]:
                  - strong [ref=f12e123]: Connection ownership and per-run resource bindings
                  - text: "— brokered MCP tools moved off capability bundles onto four objects: catalog connector definition →"
                  - strong [ref=f12e124]: connection
                  - text: (owns the credential, plus append-only tool snapshots) → agent-revision **
                  - code [ref=f12e125]: connection_requirements
                  - strong [ref=f12e126]: → per-run
                  - code [ref=f12e127]: run_resource_bindings
                  - text: "** (migration"
                  - code [ref=f12e128]: "0013"
                  - text: ), resolved to a tagged authority (
                  - code [ref=f12e129]: connection
                  - text: "|"
                  - code [ref=f12e130]: subscription_secret
                  - text: "|"
                  - code [ref=f12e131]: none
                  - text: ) across typed slots (
                  - code [ref=f12e132]: mcp
                  - text: "|"
                  - code [ref=f12e133]: workspace_fetch
                  - text: "|"
                  - code [ref=f12e134]: result_publish
                  - text: )
                  - emphasis [ref=f12e135]: before
                  - text: provisioning. Connections gained personal vs. organization ownership; a personal-connection approval is decidable
                  - strong [ref=f12e136]: only by its owner-who-invoked
                  - text: — no role, admin, or operator override.
                - listitem [ref=f12e137]:
                  - strong [ref=f12e138]: Versioned envelope sealing with a real key-retirement path
                  - text: — migration
                  - code [ref=f12e139]: "0014"
                  - text: makes every sealed column carry a
                  - code [ref=f12e140]: _key_version
                  - text: "companion:"
                  - code [ref=f12e141]: "1"
                  - text: is the legacy
                  - code [ref=f12e142]: FLUIDBOX_CREDENTIAL_KEY
                  - text: format,
                  - code [ref=f12e143]: "2"
                  - text: is a per-tenant DEK wrapped by a KEK (
                  - code [ref=f12e144]: FLUIDBOX_KMS_MODE=off|static|aws
                  - text: ) with AAD binding
                  - code [ref=f12e145]: "fbx:v2:{tenant}:{table.column}"
                  - text: so a blob is untransplantable across tenants
                  - emphasis [ref=f12e146]: or
                  - text: columns. Thirteen sealed families; a resumable, CAS-guarded
                  - code [ref=f12e147]: POST /v1/admin/reseal
                  - text: "migrates v1→v2; two boot gates fail closed in both directions. Runbook:"
                  - code [ref=f12e148]: docs/hosted/kms-operations.md
                  - text: .
                - listitem [ref=f12e149]:
                  - strong [ref=f12e150]: One hardened egress boundary for all control-plane traffic
                  - text: — two filtering-resolver clients plus a pure
                  - code [ref=f12e151]: admit_url
                  - text: pre-flight that blocks private/loopback/link-local/multicast/reserved and cloud-metadata address classes at every dial site (reqwest dials an IP literal without consulting a resolver, so the pre-flight is what actually stops
                  - code [ref=f12e152]: 169.254.169.254
                  - text: ). Broker, delivery callbacks, and both connector-OAuth token legs ride a client that
                  - strong [ref=f12e153]: refuses redirects outright
                  - text: . Git gets its own out-of-process policy.
                  - code [ref=f12e154]: FLUIDBOX_EGRESS_ALLOW_CIDRS
                  - text: opts specific CIDRs back in;
                  - code [ref=f12e155]: FLUIDBOX_EGRESS_PROXY
                  - text: re-points everything, including the git subprocess, through one waypoint.
                - listitem [ref=f12e156]:
                  - text: "**MCP"
                  - code [ref=f12e157]: 2025-11-25
                  - text: conformance, with version drift denying the call** — upstream MCP is now a per-run session (
                  - code [ref=f12e158]: initialize
                  - text: +
                  - code [ref=f12e159]: notifications/initialized
                  - text: before every call,
                  - code [ref=f12e160]: MCP-Protocol-Version
                  - text: on every request, credential re-resolved live on the terminal
                  - code [ref=f12e161]: DELETE
                  - text: ). A run's negotiated version must match its frozen surface exactly or the call is denied with a message naming the refresh endpoint. SSE is a real incremental assembler with per-event and total ceilings;
                  - code [ref=f12e162]: outputSchema
                  - text: /
                  - code [ref=f12e163]: structuredContent
                  - text: are preserved.
                - listitem [ref=f12e164]:
                  - strong [ref=f12e165]: Frozen tool schemas enforced server-side
                  - text: — arguments are validated against the schema photographed at freeze time, with the JSON Schema dialect chosen by the snapshot's protocol version (
                  - code [ref=f12e166]: 2025-11-25
                  - text: ⇒ 2020-12 per SEP-1613, otherwise draft-07). The schema is untrusted input, so it is pre-guarded (size, depth, local-
                  - code [ref=f12e167]: $ref
                  - text: "-only) before compilation; a violation makes the tool un-callable rather than being silently ignored. This inserts exactly one new stage into the permission gate and moves nothing else."
                - listitem [ref=f12e168]:
                  - strong [ref=f12e169]: At-most-once brokered dispatch
                  - text: — migration
                  - code [ref=f12e170]: "0019"
                  - text: wraps every brokered call in a durable four-state execution claim keyed
                  - code [ref=f12e171]: (session, tool_call_id, input_digest)
                  - text: .
                  - code [ref=f12e172]: failed_before_send
                  - text: requires positive proof nothing was written and is the only re-claimable state; a definitive upstream response is terminal; timeouts and mid-stream failures are recorded as
                  - code [ref=f12e173]: ambiguous
                  - text: rather than retried. Decision idempotency and execution idempotency are now distinct properties.
                - listitem [ref=f12e174]:
                  - strong [ref=f12e175]: Audience-scoped sandbox credentials
                  - text: — migration
                  - code [ref=f12e176]: "0020"
                  - text: splits the sandbox's single bearer into four tokens (
                  - code [ref=f12e177]: llm
                  - text: "|"
                  - code [ref=f12e178]: tool
                  - text: "|"
                  - code [ref=f12e179]: control
                  - text: "|"
                  - code [ref=f12e180]: workspace
                  - text: ), each checked as the first statement of its handler. Kubernetes ships one Secret with four keys routed per container, so the workspace init container never sees the others.
                - listitem [ref=f12e181]:
                  - strong [ref=f12e182]: Replica coordination primitives
                  - text: — migration
                  - code [ref=f12e183]: "0021"
                  - text: ": approval emission rides the deciding CAS inside one transaction (only the winner emits) with cross-replica"
                  - code [ref=f12e184]: pg_notify
                  - text: wakeups and the poll floor kept as a missed-notify backstop; sessions carry an orchestrator lease + epoch so a fenced-out driver cannot mutate lifecycle while a user's cancel stays deliberately unfenced; deliveries claim rows
                  - code [ref=f12e185]: FOR UPDATE SKIP LOCKED
                  - text: ", and the GitHub double-post window closes by reconcile-before-create on both comments and checks."
                - listitem [ref=f12e186]:
                  - strong [ref=f12e187]: Durable LLM budget admission
                  - text: — migration
                  - code [ref=f12e188]: "0022"
                  - text: replaces best-effort budget checks with a request-keyed reservation whose primary key
                  - emphasis [ref=f12e189]: is
                  - text: the usage entry's external id, which is what makes a 401 replay and a late drain idempotent. Booking uses a deliberately-high upper bound; release happens only on positively-proven non-dispatch; charging requires a durable usage write before the CAS.
                - listitem [ref=f12e190]:
                  - strong [ref=f12e191]: Operations
                  - text: — a bounded-cardinality metrics registry at admin-gated
                  - code [ref=f12e192]: GET /v1/admin/metrics
                  - text: (plus optional unauthenticated
                  - code [ref=f12e193]: FLUIDBOX_METRICS_BIND
                  - text: ), durable cross-replica egress governance and capacity ceilings (
                  - code [ref=f12e194]: "0023"
                  - text: ), cross-replica MCP session teardown (
                  - code [ref=f12e195]: "0024"
                  - text: ), workload identity (
                  - code [ref=f12e196]: "0025"
                  - text: ), S3-compatible archive storage alongside the filesystem backend, and a guarded load harness (
                  - code [ref=f12e197]: fluidbox-loadgen
                  - text: ) with its own manual
                  - code [ref=f12e198]: scale
                  - text: CI job.
