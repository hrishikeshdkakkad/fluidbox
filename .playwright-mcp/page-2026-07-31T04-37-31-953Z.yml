        - generic [ref=f9e127]: capabilities
        - heading "The parts you'd otherwise build around your agent runtime." [level=2] [ref=f9e128]
        - paragraph [ref=f9e129]: fluidbox is deliberately not a reasoning framework. It's the governance and execution layer that makes whichever harness you already use safe to hand a repository and a credential.
        - generic [ref=f9e130]:
          - article [ref=f9e131]:
            - generic [ref=f9e132]: policy
            - heading "Server-side tool policy" [level=3] [ref=f9e133]
            - paragraph [ref=f9e134]: Ordered rules over tools, paths, and shell commands decide allow, deny, or ask-a-human — evaluated in the control plane, where the agent can't reach. Versioned, append-only, authorable from the dashboard.
            - generic [ref=f9e135]: "- match: [\"Bash\"] action: allow shell: deny_regex: [\"rm\\\\s+-rf\\\\s+/\"] on_no_match: approve"
            - link "Policies →" [ref=f9e136] [cursor=pointer]:
              - /url: /docs/policies
          - article [ref=f9e137]:
            - generic [ref=f9e138]: approvals
            - heading "Human approval gates" [level=3] [ref=f9e139]
            - paragraph [ref=f9e140]: An approve verdict pauses the run until someone decides — once, for the session, or deny. Decisions are idempotent; an unanswered approval expires to deny. Absence never widens permission.
            - generic [ref=f9e141]: "POST /v1/approvals/{id}/decision { \"decision\": \"approved_once\" }"
            - link "Approvals →" [ref=f9e142] [cursor=pointer]:
              - /url: /docs/approvals
          - article [ref=f9e143]:
            - generic [ref=f9e144]: sandbox
            - heading "Isolated execution" [level=3] [ref=f9e145]
            - paragraph [ref=f9e146]: Every run gets a fresh, disposable container with a bind-mounted copy of your repository and no network egress. Credentials never enter it — model, git, and tool calls all terminate control-plane-side.
            - generic [ref=f9e147]: "workspace /workspace (copy — original untouched) egress none · credentials: none"
            - link "Security model →" [ref=f9e148] [cursor=pointer]:
              - /url: /docs/security
          - article [ref=f9e149]:
            - generic [ref=f9e150]: budgets
            - heading "Cost, token, and time budgets" [level=3] [ref=f9e151]
            - paragraph [ref=f9e152]: Ceilings frozen per run; usage metered off the streamed model response and enforced server-side. A run that hits its budget stops, and the spend that stopped it is in the ledger.
            - generic [ref=f9e153]: "budgets: { max_cost_usd: 2.50, max_wall_clock_secs: 1800 } spent: $0.011 · 2,148 tokens"
