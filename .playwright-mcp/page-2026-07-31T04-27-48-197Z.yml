              - 'link "Governance Policies A policy is evaluated on every tool call an agent makes. The verdict is one of allow, deny, or approve (pause for a human). Policies live in the control plane as append-only versions: the Governance page is the authoring surface, every publish is an immutable version with an author and a summary, and every run freezes a snapshot of its policy''s latest version into the RunSpec — editing a policy only affects future runs, never in-flight ones." [ref=f7e117] [cursor=pointer]':
