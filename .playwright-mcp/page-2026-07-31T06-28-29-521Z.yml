            - heading "Write code as if failure doesn’t exist" [level=3] [ref=f42e161]
            - generic [ref=f42e162]:
              - paragraph [ref=f42e163]: Distributed systems break, APIs fail, networks flake, and services crash. That’s not your problem anymore. Managing reliability shouldn’t mean constant firefighting.
              - paragraph [ref=f42e164]: Temporal Workflows automatically capture state at every step, and in the event of failure, can pick up exactly where they left off.
              - paragraph [ref=f42e165]: No lost progress, no orphaned processes, and no manual recovery required.
