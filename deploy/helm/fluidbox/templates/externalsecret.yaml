{{- /*
External Secrets wiring.

The chart's contract is unchanged: it READS `existingSecret` and never writes a
credential. This only declares where that Secret's contents come from, so the
values never appear in a values file, a CI log, or Terraform state.

A SecretStore (namespaced), not a ClusterSecretStore: this release should not be
able to reach another namespace's secrets, and a namespaced store is the
smallest thing that works.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- if not (eq .Values.externalSecrets.provider "gcpsm") }}
{{- fail (printf "externalSecrets.provider=%q is not wired in this chart (only \"gcpsm\" is). Create the Secret out-of-band instead of leaving a store that silently syncs nothing." .Values.externalSecrets.provider) }}
{{- end }}
{{- if not .Values.externalSecrets.projectID }}
{{- fail "externalSecrets.projectID is required for the gcpsm provider." }}
{{- end }}
{{- if not .Values.externalSecrets.data }}
{{- fail "externalSecrets.enabled with an empty data list would create an EMPTY Secret and the server would fail to boot on a missing DATABASE_URL. List the keys explicitly." }}
{{- end }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: SecretStore
metadata:
  name: {{ include "fluidbox.fullname" . }}
  labels: {{- include "fluidbox.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.externalSecrets.projectID | quote }}
      # No auth block: the operator's own ServiceAccount carries the Workload
      # Identity annotation, so this resolves through Application Default
      # Credentials. There is no key file anywhere in the path.
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "fluidbox.fullname" . }}
  labels: {{- include "fluidbox.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "fluidbox.fullname" . }}
    kind: SecretStore
  target:
    # The exact name the rest of the chart reads through existingSecret.
    name: {{ .Values.existingSecret }}
    {{- /* creationPolicy Owner puts an ownerReference on the target Secret, so
           deleting THIS ExternalSecret garbage-collects the Secret with it.
           deletionPolicy Retain does NOT prevent that - it governs what happens
           when a key disappears from the PROVIDER, which is a different event.
           Deleting this object therefore briefly takes the control plane's
           credentials away until the operator re-syncs. */}}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteRef | quote }}
        {{- with .version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- if .Values.externalSecrets.optionalData }}
---
{{- /* Optional provider keys get their OWN ExternalSecret and their own target
       Secret. ESO treats one unreadable remote key as a failed sync for the
       WHOLE object, so listing a not-yet-provided key next to DATABASE_URL
       would take the control plane's credentials down with it. Isolated
       here, a missing version is a failed sync of this object only, the
       target Secret simply does not exist, and every consumer reads these
       keys with optional: true. */}}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "fluidbox.fullname" . }}-optional
  labels: {{- include "fluidbox.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "fluidbox.fullname" . }}
    kind: SecretStore
  target:
    name: {{ .Values.existingSecret }}-optional
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.externalSecrets.optionalData }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteRef | quote }}
        {{- with .version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
