name: release-please

# Maintains a rolling "chore: release X.Y.Z" PR from Conventional Commits on
# main. Merging that PR is the release: this workflow then tags, creates the
# GitHub Release, and CALLS release.yml to publish images + the OCI chart.
#
# Why it calls release.yml instead of letting a tag push trigger it: GitHub
# does not start workflow runs from events created with the repository's
# GITHUB_TOKEN (a loop guard). A bot-pushed tag would produce a tag and a
# Release and NO images, with nothing failing to say so. Calling the workflow
# directly needs no PAT — and no secret that can expire silently and break
# releases months from now.
#
# Publishing is UNGATED by deliberate choice: merging the Release PR ships to
# GHCR.
#
# This file used to say the Release PR's own CI was therefore the last
# checkpoint before public, effectively permanent artifacts. **That was not
# true**, and it was measured to be untrue on PR #111 (2026-07-31): the Release
# PR's `ci` run sat at `action_required`, held for manual approval and never
# executed, because a PR authored by GITHUB_TOKEN does not get a normal
# `pull_request` run. A merge at that moment would have published with nothing
# behind it.
#
# The real floor is now the `verify-release` job below, which runs the static
# version/compose/demo guards on the release commit and gates `publish`. It is
# unconditional: no approval setting or fork policy can skip it. The Release
# PR's full CI is still valuable — it is just no longer the ONLY thing standing
# between a merge and GHCR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Re-resolve Cargo.lock on the Release PR branch.
      #
      # release-type is `simple`, not `rust`, because the rust strategy is
      # structurally incompatible with this workspace: it rewrites
      # `package.version` in every member (ours inherit via
      # `version.workspace = true`, so there is no literal to rewrite) and then
      # requires the ROOT manifest to be a package (ours is a VIRTUAL workspace
      # manifest, no [package] section). It threw `is not a package manifest
      # (might be a cargo workspace)` on every merge to main from 2026-07-29
      # until this was fixed.
      #
      # `simple` bumps the one canonical site — [workspace.package] version in
      # Cargo.toml, via the x-release-please-version annotation — but it has no
      # Cargo.lock updater, and the members' recorded versions in the lock go
      # stale the moment that bumps. `version-check.sh` fails on exactly that,
      # and it runs on the Release PR, which the header above calls the last
      # checkpoint before public artifacts. So the lock is re-resolved here
      # rather than left for a human to notice.
      # NOTE: `pr` is passed as a RAW STRING and parsed in the shell, never with
      # `fromJSON(...)` in `env:`. A template expression is evaluated before the
      # step's `if` can skip it, so when the action fails before setting `pr`,
      # `fromJSON('')` aborts the whole job with
      #   The template is not valid ... Error reading JToken from JsonReader
      # which REPLACES the real error with a confusing one. Observed exactly
      # that on f699bbe: release-please failed for an unrelated reason, and this
      # step's template error was the second annotation on the run.
      - if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != ''
        name: re-resolve Cargo.lock on the release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          BRANCH=$(printf '%s' "$PR_JSON" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("headBranchName",""))')
          if [ -z "$BRANCH" ]; then
            echo "::warning::release PR JSON carried no headBranchName; skipping Cargo.lock re-resolve"
            exit 0
          fi
          git clone --branch "$BRANCH" --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rp
          cd rp
          # Rewrites Cargo.lock in place if the workspace version moved.
          cargo metadata --format-version 1 >/dev/null
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already agrees with the bumped version"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: re-resolve Cargo.lock for the release version"
          git push origin "$BRANCH"
          echo "Cargo.lock re-resolved and pushed to $BRANCH"

  # The last checkpoint, made UNCONDITIONAL.
  #
  # The header above claims the Release PR's own CI is what stands between a
  # merge and permanent public artifacts. Measured on PR #111, that claim was
  # false: the Release PR's `ci` run sat at `action_required` — held for manual
  # approval, not run. Publishing is ungated by choice, so a Release PR merged
  # without someone noticing that would have shipped images to GHCR with NO CI
  # behind the release commit at all.
  #
  # These are the fast, static checks that catch the failure mode that actually
  # matters here — a release whose version sites disagree, which is how a
  # mislabelled artifact gets published. They take seconds, need no database,
  # no daemon and no network, and they run on the RELEASE COMMIT itself. They
  # cannot be skipped by an approval setting, a fork policy, or a bot-authored
  # PR not triggering `pull_request`.
  #
  # This does not replace the full CI suite; it guarantees a floor.
  verify-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: version sites agree
        run: bash scripts/version-check.sh
      - name: compose files hold their invariants
        run: bash deploy/compose-assertions.sh
      - name: the demo's static self-checks hold
        run: bash scripts/demo-selftest.sh

  # Only runs on the push that merged a Release PR, and only behind the floor.
  publish:
    needs: [release-please, verify-release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
