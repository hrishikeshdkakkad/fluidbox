name: release-please

# Maintains a rolling "chore: release X.Y.Z" PR from Conventional Commits on
# main. Merging that PR is the release: this workflow then tags, creates the
# GitHub Release, and CALLS release.yml to publish images + the OCI chart.
#
# Why it calls release.yml instead of letting a tag push trigger it: GitHub
# does not start workflow runs from events created with the repository's
# GITHUB_TOKEN (a loop guard). A bot-pushed tag would produce a tag and a
# Release and NO images, with nothing failing to say so. Calling the workflow
# directly needs no PAT — and no secret that can expire silently and break
# releases months from now.
#
# Publishing is UNGATED by deliberate choice: merging the Release PR ships to
# GHCR. The Release PR's own CI is therefore the last checkpoint before public,
# effectively permanent artifacts — which is why `version-check` runs in CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Re-resolve Cargo.lock on the Release PR branch.
      #
      # release-type is `simple`, not `rust`, because the rust strategy is
      # structurally incompatible with this workspace: it rewrites
      # `package.version` in every member (ours inherit via
      # `version.workspace = true`, so there is no literal to rewrite) and then
      # requires the ROOT manifest to be a package (ours is a VIRTUAL workspace
      # manifest, no [package] section). It threw `is not a package manifest
      # (might be a cargo workspace)` on every merge to main from 2026-07-29
      # until this was fixed.
      #
      # `simple` bumps the one canonical site — [workspace.package] version in
      # Cargo.toml, via the x-release-please-version annotation — but it has no
      # Cargo.lock updater, and the members' recorded versions in the lock go
      # stale the moment that bumps. `version-check.sh` fails on exactly that,
      # and it runs on the Release PR, which the header above calls the last
      # checkpoint before public artifacts. So the lock is re-resolved here
      # rather than left for a human to notice.
      # NOTE: `pr` is passed as a RAW STRING and parsed in the shell, never with
      # `fromJSON(...)` in `env:`. A template expression is evaluated before the
      # step's `if` can skip it, so when the action fails before setting `pr`,
      # `fromJSON('')` aborts the whole job with
      #   The template is not valid ... Error reading JToken from JsonReader
      # which REPLACES the real error with a confusing one. Observed exactly
      # that on f699bbe: release-please failed for an unrelated reason, and this
      # step's template error was the second annotation on the run.
      - if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != ''
        name: re-resolve Cargo.lock on the release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          BRANCH=$(printf '%s' "$PR_JSON" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("headBranchName",""))')
          if [ -z "$BRANCH" ]; then
            echo "::warning::release PR JSON carried no headBranchName; skipping Cargo.lock re-resolve"
            exit 0
          fi
          git clone --branch "$BRANCH" --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rp
          cd rp
          # Rewrites Cargo.lock in place if the workspace version moved.
          cargo metadata --format-version 1 >/dev/null
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already agrees with the bumped version"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: re-resolve Cargo.lock for the release version"
          git push origin "$BRANCH"
          echo "Cargo.lock re-resolved and pushed to $BRANCH"

  # Only runs on the push that merged a Release PR.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
