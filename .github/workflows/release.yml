name: release

# Publishes the five fluidbox images + the OCI Helm chart to GHCR. Free for
# public repos; no model credentials are involved anywhere in this workflow.
#
# The version is an INPUT, never derived from the ref. This workflow used to
# trigger on `push: tags: ["v*"]` and read the version out of GITHUB_REF_NAME.
# That cannot work under release-please: GitHub does not start workflow runs
# from events created with the repository's GITHUB_TOKEN (a loop guard), so a
# bot-pushed tag would produce a tag and a GitHub Release and NO images, with
# nothing failing to say so. release-please therefore CALLS this workflow.
#
# The tag trigger is deliberately gone rather than kept alongside: two entry
# points computing the version by different routes is the same disease as the
# version drift this replaced. One path cannot diverge from itself.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish, WITHOUT a leading v (e.g. 0.4.0)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, WITHOUT a leading v (e.g. 0.4.0)"
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Build each image natively per architecture (no QEMU — a QEMU'd release
  # cargo build takes the better part of an hour) and push by digest.
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [server, web, sandbox-runner, codex-runner, workspaced]
        platform:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7
      - name: resolve dockerfile + context
        id: target
        run: |
          case "${{ matrix.image }}" in
            server)         echo "file=deploy/server.Dockerfile" >> "$GITHUB_OUTPUT"; echo "context=." >> "$GITHUB_OUTPUT" ;;
            web)            echo "file=deploy/web.Dockerfile"    >> "$GITHUB_OUTPUT"; echo "context=." >> "$GITHUB_OUTPUT" ;;
            sandbox-runner) echo "file=images/sandbox-runner/Dockerfile" >> "$GITHUB_OUTPUT"; echo "context=images" >> "$GITHUB_OUTPUT" ;;
            codex-runner)   echo "file=images/codex-runner/Dockerfile"   >> "$GITHUB_OUTPUT"; echo "context=images" >> "$GITHUB_OUTPUT" ;;
            workspaced)     echo "file=deploy/workspaced.Dockerfile" >> "$GITHUB_OUTPUT"; echo "context=." >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.target.outputs.context }}
          file: ${{ steps.target.outputs.file }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/fluidbox-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
      - name: export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest per image.
  publish:
    needs: build
    strategy:
      matrix:
        image: [server, web, sandbox-runner, codex-runner, workspaced]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/fluidbox-${{ matrix.image }}
          # `type=semver` extracts the version FROM THE GIT REF and emits
          # nothing when the ref is not a tag. Under workflow_call the ref is
          # the default branch, so it would silently publish :latest-only
          # images while the chart below references :X.Y.Z — an
          # ImagePullBackOff in a user's cluster, from a green workflow.
          # The version is an input, so tag from the input.
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha
            type=raw,value=latest
      - name: create manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/fluidbox-${{ matrix.image }}@sha256:%s ' *)
      - name: inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository_owner }}/fluidbox-${{ matrix.image }}:latest

  # Publish the Helm chart as an OCI artifact to GHCR alongside the images.
  # Waits for the images. No longer gated on the trigger: both entry points now
  # carry an explicit `version` input and the publish job tags images from that
  # same input, so the chart can never reference an image tag that was not
  # pushed. (Previously this was gated to tag pushes precisely because
  # metadata-action's semver tag only materialized there.)
  chart:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: package + push chart (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          # Bind the chart to this release: --app-version rewrites appVersion
          # inside the package, and the image defaults render from
          # .Chart.AppVersion — so the packaged chart pulls exactly the images
          # this run published (M9). Strip semver build metadata: '+' is not
          # a legal image-tag character, so the images are never tagged with
          # it — the chart must reference what actually got pushed.
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION%%+*}"
          # The publish job tags images with this same input verbatim. If it is
          # not a legal image tag, those images do not exist under the name
          # this chart is about to bake in. Fail loudly rather than ship a
          # chart that ImagePullBackOffs in a user's cluster.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "version '${{ inputs.version }}' is not valid SemVer; refusing to publish a chart referencing unpublished images" >&2
            exit 1
          fi
          helm package deploy/helm/fluidbox --destination /tmp/chart \
            --version "$VERSION" --app-version "$VERSION"
          helm push /tmp/chart/fluidbox-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
